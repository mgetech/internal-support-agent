[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-agent"
version = "0.1.0"
description = "Internal employee support agent for HR and IT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "langgraph==1.2.11",
    "openai==3.16.2",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.2",
    "pgvector==0.5.0",
    "mcp==2.2.0",
    "streamlit==1.64.0",
    "langfuse==4.15.4",
    "tenacity==9.1.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
