name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: support_agent
          POSTGRES_PASSWORD: support_agent
          POSTGRES_DB: support_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_agent -d support_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://support_agent:support_agent@localhost:5432/support_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: make setup
      - name: Lint
        run: make lint
      # The DB tests skip when no database answers. Applying the schema here makes the job
      # fail instead of skipping them.
      - name: Apply the schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/init.sql
      # Runs the DB tests, and the checks on the hand-written policies: the version bump
      # rule, the chunk snapshot, the chunk ids that scenarios cite, and a deterministic
      # seed. No model keys are needed.
      - name: Test
        run: make test
